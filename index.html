<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Metadata -->
    <title>D&D Dashboard</title>
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="application-name" content="">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="error-banner" style="display: none; background-color: #8b1e2d; color: white; padding: 1rem; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 1000;">
    <span id="error-message">An error occurred while loading the dashboard.</span>
</div>

<main id="app">

    <!-- Dashboard -->
    <section id="dashboard">

        <header id="character-header">
            <!-- Main header -->
            <div id="character-identity">
                <h1 id="character-name">Character Name</h1>
                <p id="character-summary"></p>
            </div>

            <!-- Character Selector Dropdown -->
            <div id="character-selector">
                <label for="character-select">Active Character</label>

                <div class="character-selector-row">
                    <select id="character-select" name="character">
                        <option value="default" selected>
                            Current Character
                        </option>
                    </select>

                    <button
                        class="icon-button"
                        id="add-character-button"
                        type="button"
                        aria-haspopup="menu"
                        aria-expanded="false"
                        title="Add Character">
                        +
                    </button>
                </div>

                <button class="secondary-button" id="export-current-character" type="button">
                    Export JSON
                </button>

                <div class="popover-menu" id="add-character-menu" role="menu" hidden>
                    <button id="create-character-action" type="button" role="menuitem">
                        Create New Character
                    </button>
                    <button id="import-character-action" type="button" role="menuitem">
                        Import JSON
                    </button>
                </div>

                <input
                    id="character-import-input"
                    type="file"
                    accept="application/json,.json"
                    hidden>
            </div>

        </header>

        <!-- Character -->
        <section class="dashboard-section" id="character-section">
            <h2>Character</h2>

            <div id="character-links" class="character-grid">

                <!-- Species -->
                <div class="character-group">
                    <h3>Species</h3>
                    <div class="character-buttons" id="character-species"></div>
                </div>

                <!-- Class & Subclass -->
                <div class="character-group">
                    <h3>Class</h3>
                    <div class="character-buttons" id="character-classes"></div>
                </div>

                <!-- Feats -->
                <div class="character-group">
                    <h3>Feats</h3>
                    <div class="character-buttons" id="character-feats"></div>
                </div>

            </div>
        </section>


        <!-- Spells -->
        <section class="dashboard-section" id="spells-section">
            <h2>Spells</h2>
            <div id="spell-links">
            </div>
        </section>


        <!-- Magic Items -->
        <section class="dashboard-section" id="magic-items-section">
            <h2>Magic Items</h2>
            <div id="magic-item-links">
            </div>
        </section>


        <!-- References -->
        <section class="dashboard-section" id="reference-section">
            <h2>References</h2>
            <div id="reference-links">
            </div>
        </section>

        <footer id="dashboard-footer">
            <span id="footer-version"></span>
            <span>Created by Luke Ryan</span>
            <span>
        References:
            <a href="http://dnd2024.wikidot.com/"
               target="dnd-reference">
                D&D 5e 2024 Wikidot
            </a>
        </span>
        </footer>

    </section>

</main>


<!-- JavaScript -->
<script type="module" src="js/app.js"></script>

</body>

</html>
