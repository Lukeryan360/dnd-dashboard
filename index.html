<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D&D Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main id="app">

    <!-- Dashboard -->
    <section id="dashboard">

        <header id="character-header">
            <h1 id="character-name">Character Name</h1>
            <p id="character-summary"></p>
        </header>


        <!-- Character -->
        <section class="dashboard-section" id="character-section">
            <h2>Character</h2>

            <div id="character-links">
                <!-- Generated by JS -->
            </div>
        </section>


        <!-- Spells -->
        <section class="dashboard-section" id="spells-section">
            <h2>Spells</h2>

            <div id="spell-links">
                <!-- Generated by JS -->
            </div>
        </section>


        <!-- Magic Items -->
        <section class="dashboard-section" id="magic-items-section">
            <h2>Magic Items</h2>

            <div id="magic-item-links">
                <!-- Generated by JS -->
            </div>
        </section>


        <!-- References -->
        <section class="dashboard-section" id="reference-section">
            <h2>References</h2>

            <div id="reference-links">
                <!-- Generated by JS -->
            </div>
        </section>

    </section>


    <!-- Wikidot Viewer -->
    <aside id="viewer">

        <button id="viewer-close" type="button">
            ×
        </button>

        <iframe
                id="wiki-frame"
                title="D&D Wikidot Reference">
        </iframe>

    </aside>

</main>


<!-- JavaScript -->
<script src="js/urls.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>

</html>
